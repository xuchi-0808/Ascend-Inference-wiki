site_name: Ascend Inference Wiki
site_description: 昇腾推理开发经验 wiki
site_author: 推理开发部
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://ascend-inference-wiki.readthedocs.io/"]

repo_url: https://github.com/xuchi-0808/Ascend-Inference-wiki
repo_name: Ascend-Inference-wiki
edit_uri: edit/master/docs/

docs_dir: docs

theme:
  name: material
  language: zh
  custom_dir: overrides
  favicon: assets/ascend-favicon.ico
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - navigation.prune
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 切换暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 切换亮色模式
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

plugins:
  - search:
      lang:
        - en
        - ja
  - meta
  - tags
  - blog:
      post_readtime: false
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      timezone: Asia/Shanghai
      enable_git_follow: false

hooks:
  - docs/hooks/page_authors.py

nav:
  - 首页: index.md
  - 操作指南:
      - guides/index.md
      - 环境搭建:
          - guides/environment/building-vllm-ascend-from-source.md
          - guides/environment/download-from-cmc-with-aria2c.md
      - 部署拉起:
          - guides/deployment/dual-node-test-manual-launch-guide.md
          - guides/deployment/qwen3-235b-manual-launch.md
      - 测试压测:
          - guides/benchmarking/extracting-test-procedure-from-ci-logs.md
      - 故障排查:
          - guides/troubleshooting/environment-troubleshooting-guide.md
  - 参考手册:
      - reference/index.md
  - 原理解析:
      - explanations/index.md
      - explanations/dsv32-dp-o-matrix-column-splitting.md
      - explanations/dsv4-mla-o-matrix-module-level-tp.md
      - explanations/lmhead-tp-code-tracing.md
      - vllm 权重加载与基础并行策略（TP、EP）: explanations/vllm-weight-loading-tp-ep.md
  - 设计方案:
      - design/index.md
      - design/wiki-information-architecture.md
  - 博客:
      - blog/index.md
  - 标签: tags.md
  - 关于: about.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/xuchi-0808/Ascend-Inference-wiki

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

copyright: Copyright &copy; 推理开发部
